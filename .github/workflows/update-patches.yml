name: Update patch data

# Runs the full pipeline (scrape -> parse -> rebuild database) on a
# schedule, and commits the result back to the repo if anything
# actually changed. Render is watching this repo, so a new commit here
# automatically triggers a redeploy with the fresh data -- no manual
# steps needed after this is set up.
#
# Riot's patches typically release on Tuesdays/Wednesdays, so this runs
# Wednesday afternoon UTC to comfortably catch same-day releases. You
# can also trigger it manually anytime from the "Actions" tab on GitHub
# (that's what workflow_dispatch below enables).

on:
  schedule:
    - cron: "0 16 * * 3"
  workflow_dispatch:

# GitHub's automatic token is read-only by default -- without this, the
# final "commit and push" step fails with a permission error (exit 128).
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape latest patches
        run: python scraper.py

      - name: Parse patch data
        run: python parser.py

      - name: Rebuild database
        run: python build_database.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add parsed_changes.json patches.db
          git diff --staged --quiet || git commit -m "Auto-update: refresh patch data"
          git push
